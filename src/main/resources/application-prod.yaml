# /murder-help/prod/ 하위 AWS Parameter Store 값들은 배포 환경(ECS 등)에서
# 아래와 동일한 이름의 OS 환경변수로 주입된다는 전제로 참조한다.
spring:
  datasource:
    url: jdbc:mysql://${AWS_RDS_HOST}:${AWS_RDS_PORT}/murder_help
    username: ${AWS_RDS_USERNAME}
    password: ${AWS_RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${AWS_REDIS_HOST}
      port: ${AWS_REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

aws:
  s3:
    bucket: murder-help-bucket
    prefix: prod