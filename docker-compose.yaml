services:
  mysql:
    image: mysql:8.0
    container_name: murder-help-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: murder_help
      MYSQL_USER: murder
      MYSQL_PASSWORD: murder1234
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: murder-help-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql-data: