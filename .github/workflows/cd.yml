name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy

    runs-on: ubuntu-latest

    # CI 성공하고, push 이벤트인 경우
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECR 로그인
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Metadata 및 Docker 이미지 이름 설정
        id: meta
        shell: bash
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          IMAGE_TAG="${BRANCH}-${SHA}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${{ github.repository }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${ECR_REGISTRY}/${{ vars.AWS_ECR_REPOSITORY }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}
            ${{ steps.meta.outputs.ecr_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          CONTAINER_NAME: murder-help
        run: |
          set -euo pipefail

          ECR_URI=$ECR_REGISTRY/${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_URI=$ECR_URI:$IMAGE_TAG
          
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
          
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker rm -f $CONTAINER_NAME 2>/dev/null || true",
              "docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 8080:8080 $IMAGE_URI",
              "docker image prune -f",
              "docker ps --filter name=$CONTAINER_NAME"
            ]
          }
          EOF
          
          COMMAND_ID=$(
            aws ssm send-command \
              --region "${{ vars.AWS_REGION }}" \
              --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ${{ env.IMAGE_TAG }}" \
              --parameters file://ssm-parameters.json \
              --timeout-seconds 600 \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM Command ID: ${COMMAND_ID}"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_INSTANCE_ID }}"
