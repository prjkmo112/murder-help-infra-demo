name: CI

on:
  pull_request:
    branches: [ dev,main ]

  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 컴파일 확인
        run: ./gradlew clean compileJava compileTestJava --console=plain

      - name: Build & Test
        run: ./gradlew test jacocoTestReport --console=plain

      # Jacoco 보고서 생성
      - name: JaCoCo Coverage Summary
        if: always()
        run: python3 scripts/jacoco-summary.py

      - name: PR에 JaCoCo 보고서 코멘트
        if: github.event_name == 'pull_request' && hashFiles('jacoco-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file jacoco-comment.md \
            --edit-last \
            --create-if-none